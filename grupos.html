<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAMR — Grupos</title>
  <link rel="icon" href="famrlogo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="navContainer"></div>

<main class="main-content">
  <div class="page-header">
    <h2>👥 Grupos e Subgrupos</h2>
    <p>Estrutura hierárquica da FAMR.</p>
  </div>

  <div id="groupsContainer" class="groups-list">
    <div class="loading-spinner"><div class="spinner"></div><p>Carregando grupos...</p></div>
  </div>
</main>

<script src="auth.js"></script>
<script src="app.js"></script>
<script>
  (async () => {
    await initProtectedPage('grupos');
    if (!window.currentProfile()) return;

    const [{ data: groups }, { data: subgroups }] = await Promise.all([
      window.sb.from('groups').select('*').eq('is_visible', true).order('hierarchy_level', { ascending: false }),
      window.sb.from('subgroups').select('*').eq('is_visible', true).order('hierarchy_level', { ascending: false })
    ]);

    const container = document.getElementById('groupsContainer');
    if (!groups || groups.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>Nenhum grupo visível.</p></div>';
      return;
    }

    container.innerHTML = groups.map(g => {
      const gSubgroups = (subgroups || []).filter(s => s.group_id === g.id);
      return `
        <div class="group-card" style="border-top-color:${g.color}">
          <div class="group-card-header">
            <div class="group-color-bar" style="background:${g.color}"></div>
            <div>
              <h3 class="group-card-title" style="color:${g.color}">${window.escapeHtml(g.name)}</h3>
              <span style="font-size:0.75rem;color:var(--famr-text-muted)">Hierarquia: ${g.hierarchy_level}</span>
            </div>
          </div>
          <p class="group-card-desc">${window.escapeHtml(g.description || '')}</p>
          ${gSubgroups.length > 0 ? `
            <div class="subgroup-list">
              <strong style="font-size:0.8rem;color:var(--famr-text-muted)">Subgrupos:</strong>
              ${gSubgroups.map(s => `
                <div class="subgroup-item">
                  <span class="subgroup-dot" style="background:${s.color}"></span>
                  <span style="color:${s.color};font-weight:600">${window.escapeHtml(s.name)}</span>
                  <span style="font-size:0.7rem;color:var(--famr-text-muted)">· Nível ${s.hierarchy_level}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>`;
    }).join('');
  })();
</script>

</body>
</html>
