<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAMR — Perfil</title>
  <link rel="icon" href="famrlogo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="navContainer"></div>

<main class="main-content">
  <div class="page-header">
    <h2>👤 Perfil Militar</h2>
  </div>

  <div id="profileContent">
    <div class="loading-spinner"><div class="spinner"></div><p>Carregando perfil...</p></div>
  </div>
</main>

<script src="auth.js"></script>
<script src="app.js"></script>
<script>
  (async () => {
    await initProtectedPage('perfil');
    if (!window.currentProfile()) return;

    // Verificar se está vendo perfil de outro usuário
    const params = new URLSearchParams(window.location.search);
    const viewUserId = params.get('id');
    const myProfile = window.currentProfile();
    const targetId = viewUserId || myProfile.id;

    const { data: profile, error } = await window.sb
      .from('profiles')
      .select('*, groups(name,color,hierarchy_level), subgroups(name,color,hierarchy_level)')
      .eq('id', targetId)
      .single();

    const container = document.getElementById('profileContent');
    if (error || !profile) {
      container.innerHTML = '<div class="empty-state"><p>Perfil não encontrado ou sem permissão de acesso.</p></div>';
      return;
    }

    const isSelf = targetId === myProfile.id;
    const avatarHtml = profile.avatar_url
      ? `<img src="${profile.avatar_url}" class="profile-avatar-large" alt="avatar">`
      : `<div class="profile-avatar-large">${profile.nickname.charAt(0).toUpperCase()}</div>`;

    container.innerHTML = `
      <div class="profile-card">
        <div class="profile-banner"></div>
        <div class="profile-avatar-section">
          ${avatarHtml}
          <div class="profile-name-section">
            <h2>${window.escapeHtml(profile.nickname)}</h2>
            <span class="profile-rank">${window.escapeHtml(profile.rank || 'Sem graduação')}</span>
          </div>
        </div>
        <div class="profile-details">
          <div class="profile-detail-row">
            <span class="profile-detail-label">E-mail</span>
            <span class="profile-detail-value">${isSelf || ['admin','master'].includes(myProfile.role) ? profile.email : '••••@••••'}</span>
          </div>
          <div class="profile-detail-row">
            <span class="profile-detail-label">Role</span>
            <span class="profile-detail-value"><span class="role-badge role-${profile.role}">${profile.role}</span></span>
          </div>
          <div class="profile-detail-row">
            <span class="profile-detail-label">Grupo</span>
            <span class="profile-detail-value">${profile.groups ? `<span style="color:${profile.groups.color};font-weight:700">${window.escapeHtml(profile.groups.name)}</span>` : '—'}</span>
          </div>
          <div class="profile-detail-row">
            <span class="profile-detail-label">Subgrupo</span>
            <span class="profile-detail-value">${profile.subgroups ? `<span style="color:${profile.subgroups.color};font-weight:700">${window.escapeHtml(profile.subgroups.name)}</span>` : '—'}</span>
          </div>
          <div class="profile-detail-row">
            <span class="profile-detail-label">Status</span>
            <span class="profile-detail-value">
              ${profile.is_banned ? '<span class="status-badge status-banned">BANIDO</span>' :
                profile.is_active ? '<span class="status-badge status-active">ATIVO</span>' :
                '<span class="status-badge status-pending">PENDENTE</span>'}
            </span>
          </div>
          <div class="profile-detail-row">
            <span class="profile-detail-label">Último Login</span>
            <span class="profile-detail-value">${profile.last_login ? window.formatDate(profile.last_login) : 'Nunca'}</span>
          </div>
          <div class="profile-detail-row">
            <span class="profile-detail-label">Membro desde</span>
            <span class="profile-detail-value">${window.formatDate(profile.created_at)}</span>
          </div>
        </div>
      </div>

      ${isSelf ? `
      <div class="req-form-container" style="margin-top:24px">
        <h3>✏️ Editar Perfil</h3>
        <form onsubmit="updateProfile(event)">
          <div class="form-group" style="margin-bottom:14px">
            <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--famr-text-muted);margin-bottom:4px">Avatar URL (Google Drive ou link direto)</label>
            <input type="url" id="editAvatar" class="form-input" value="${window.escapeHtml(profile.avatar_url || '')}" placeholder="https://...">
          </div>
          <div class="form-group" style="margin-bottom:14px">
            <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--famr-text-muted);margin-bottom:4px">Graduação / Rank</label>
            <input type="text" id="editRank" class="form-input" value="${window.escapeHtml(profile.rank || '')}" placeholder="Ex: Soldado, Cabo, Sargento...">
          </div>
          <button type="submit" class="btn btn-primary">💾 SALVAR ALTERAÇÕES</button>
        </form>
      </div>` : ''}
    `;
  })();

  async function updateProfile(e) {
    e.preventDefault();
    const avatar = document.getElementById('editAvatar').value.trim();
    const rank = document.getElementById('editRank').value.trim();

    const { error } = await window.sb
      .from('profiles')
      .update({ avatar_url: avatar, rank: rank })
      .eq('id', window.currentProfile().id);

    if (error) return window.showToast('Erro: ' + error.message, 'error');
    window.showToast('Perfil atualizado!');
    // Recarregar
    setTimeout(() => window.location.reload(), 1000);
  }
</script>

</body>
</html>
