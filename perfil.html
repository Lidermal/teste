<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAMR • Perfil Militar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="famrlogo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: {
    famr: {900:'#0b3d2c',800:'#0e4433',700:'#14563f',600:'#1a6b4f',500:'#278563',100:'#e6f2ec',50:'#f2f8f5'},
    gold: {600:'#a8861d',500:'#c9a227',300:'#e6c65c',100:'#faf3dc'},
    ink:'#182420', muted:'#5f6d66', line:'#e4e9e6', paper:'#f4f6f5'
  },
  fontFamily: { display:['Sora','sans-serif'], sans:['Manrope','sans-serif'] }
}}}
</script>
</head>
<body class="bg-paper text-ink font-sans antialiased">

<header class="topbar z-40">
  <div class="max-w-[1500px] mx-auto px-4 h-16 flex items-center gap-4">
    <a href="index.html#/home" class="flex items-center gap-3 shrink-0">
      <img src="famrlogo.png" class="w-10 h-10 object-contain" onerror="this.style.display='none'">
      <div class="hidden sm:block leading-tight">
        <span class="font-display font-extrabold text-famr-800 tracking-wide">FAMR <span class="text-gold-600">SYSTEM</span></span>
        <span class="block text-[10px] tracking-[0.3em] uppercase text-muted">Habbo BR • Oficial</span>
      </div>
    </a>
    <div class="flex-1"></div>
    <div class="flex items-center gap-3 shrink-0">
      <a href="index.html#/home" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Voltar ao Índice</a>
      <button id="btn-logout" title="Sair" class="w-9 h-9 rounded-full grid place-items-center text-muted hover:text-red-600 hover:bg-red-50 transition-colors"><i class="fas fa-power-off"></i></button>
    </div>
  </div>
</header>

<main class="max-w-[1500px] mx-auto p-4 md:p-8">
  <div id="perfil-content"></div>
</main>

<div id="toast-root" class="fixed top-20 right-4 z-[80] space-y-2 w-80"></div>

<script src="config.js"></script>
<script src="perfil.js"></script>
</body>
</html>
