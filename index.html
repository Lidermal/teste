<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAMR • Portal Oficial</title>
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Google Fonts (Sora & Manrope) -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Seu CSS Customizado -->
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="famrlogo.png">

<script>
tailwind.config = { theme: { extend: {
  colors: {
    famr: {900:'#0b3d2c',800:'#0e4433',700:'#14563f',600:'#1a6b4f',500:'#278563',100:'#e6f2ec',50:'#f2f8f5'},
    gold: {600:'#a8861d',500:'#c9a227',300:'#e6c65c',100:'#faf3dc'},
    ink:'#182420', muted:'#5f6d66', line:'#e4e9e6', paper:'#f4f6f5'
  },
  fontFamily: { display:['Sora','sans-serif'], sans:['Manrope','sans-serif'] }
}}}
</script>
</head>
<body class="bg-paper text-ink font-sans antialiased h-screen overflow-hidden flex flex-col">

<!-- ══════════ TELAS DE LOGIN/AUTH (Ocultas por padrão quando logado) ══════════ -->
<div id="screen-login" class="fixed inset-0 z-[100] bg-white hidden flex items-center justify-center p-4">
  <div class="w-full max-w-md fade-up">
     <!-- ... conteúdo do login simplificado ou mantido do seu original ... -->
     <h2 class="font-display text-2xl font-bold mb-4 text-center">Login FAMR</h2>
     <form id="form-login" class="space-y-4">
       <input id="login-nick" class="input w-full" placeholder="Nickname" required>
       <input id="login-pass" type="password" class="input w-full" placeholder="Senha" required>
       <button type="submit" class="btn btn-primary w-full">Entrar</button>
     </form>
  </div>
</div>

<!-- ══════════ SHELL PRINCIPAL (APP) ══════════ -->
<div id="shell" class="hidden h-full flex flex-col">
  
  <!-- HEADER SUPERIOR (Branco, Full Width) -->
  <header class="topbar shrink-0 z-40 bg-white border-b border-line shadow-sm relative">
    <div class="max-w-[1600px] mx-auto px-4 h-16 flex items-center gap-4">
      
      <!-- Logo Esquerda -->
      <a href="#/home" class="flex items-center gap-3 shrink-0 group">
        <img src="famrlogo.png" class="w-10 h-10 object-contain transition-transform group-hover:scale-110" onerror="this.style.display='none'">
        <div class="leading-tight hidden sm:block">
          <span class="font-display font-extrabold text-famr-900 tracking-wide block text-lg">FAMR SYSTEM</span>
          <span class="block text-[10px] tracking-[0.2em] uppercase text-gold-600 font-bold mt-[-2px]">HABBO BR • OFICIAL</span>
        </div>
      </a>

      <!-- Busca Central -->
      <div class="relative flex-1 max-w-xl mx-auto hidden md:block">
        <div class="input-wrap !bg-gray-50 !border-transparent focus-within:!bg-white focus-within:!shadow-md transition-all rounded-full">
          <i class="fas fa-magnifying-glass !left-4 !text-gray-400 top-1/2 -translate-y-1/2 absolute pointer-events-none"></i>
          <input id="global-search" class="input !pl-10 !pr-4 !py-2.5 !rounded-full !text-sm !border-none !bg-transparent w-full outline-none" placeholder="Buscar militar..." autocomplete="off">
        </div>
        <div id="search-drop" class="hidden absolute left-0 right-0 mt-2 card p-2 z-50 max-h-80 overflow-auto shadow-xl"></div>
      </div>

      <!-- Perfil Direita -->
      <div class="flex items-center gap-3 shrink-0 ml-auto">
        <a href="#/perfil/me" id="chip-profile" class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full border border-line bg-white hover:border-famr-500 hover:bg-famr-50 transition-colors cursor-pointer group">
          <span id="user-avatar" class="w-8 h-8 rounded-full grid place-items-center text-white font-bold text-xs bg-famr-700 shadow-inner ring-2 ring-white">?</span>
          <div class="hidden md:flex flex-col leading-none text-left">
            <span id="user-nick" class="text-xs font-bold text-ink truncate max-w-[120px] group-hover:text-famr-700">Carregando...</span>
            <span id="user-group" class="text-[9px] uppercase tracking-wider text-gold-600 font-bold mt-0.5">—</span>
          </div>
        </a>
        <button id="btn-logout" title="Sair" class="w-8 h-8 rounded-full grid place-items-center text-muted hover:text-red-600 hover:bg-red-50 transition-colors">
          <i class="fas fa-power-off text-sm"></i>
        </button>
      </div>
    </div>
    <!-- Linha decorativa dourada/verde sob o header -->
    <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-gold-500 to-transparent opacity-50"></div>
  </header>

  <!-- CORPO SPLIT: SIDEBAR + MAIN CONTENT -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- SIDEBAR ESQUERDA (Verde Escuro Fixo) -->
    <aside class="sidebar w-64 shrink-0 flex flex-col border-r border-black/10 overflow-y-auto custom-scrollbar bg-gradient-to-b from-famr-800 to-famr-900 text-emerald-50">
      <nav id="sidebar-nav" class="p-4 space-y-1 flex-1">
        <!-- Itens injetados via JS -->
      </nav>
      <div class="p-4 mt-auto border-t border-white/10 text-center">
        <span class="text-[10px] text-emerald-100/40 tracking-widest uppercase block font-bold">★ Conexão Segura</span>
      </div>
    </aside>

    <!-- CONTEÚDO DIREITA (Rolável, Fundo Cinza Claro) -->
    <main class="flex-1 overflow-y-auto bg-paper relative custom-scrollbar-main">
      <div id="maintenance-banner" class="hidden sticky top-0 z-30 bg-gold-100 text-gold-800 px-4 py-2 text-sm font-bold border-b border-gold-300">
        <i class="fas fa-screwdriver-wrench mr-2"></i>Modo manutenção ATIVO — visível apenas para administradores.
      </div>
      <div id="content" class="p-6 max-w-[1200px] mx-auto min-h-full pb-20">
        <!-- Home renderiza aqui -->
      </div>
    </main>
  </div>
</div>

<!-- MODAL & TOASTS -->
<div id="modal-root" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4 bg-ink/60 backdrop-blur-sm">
  <div class="card w-full max-w-lg max-h-[85vh] flex flex-col fade-up shadow-2xl">
    <div class="card-head justify-between bg-green-800 text-white">
      <h3 id="modal-title" class="font-display font-bold text-sm uppercase tracking-wide"></h3>
      <button onclick="closeModal()" class="hover:text-gold-300 transition-colors"><i class="fas fa-xmark"></i></button>
    </div>
    <div id="modal-body" class="p-5 overflow-auto space-y-4 bg-white"></div>
    <div id="modal-footer" class="px-5 py-4 border-t border-line bg-gray-50 flex justify-end gap-2"></div>
  </div>
</div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[80] space-y-2 w-80 pointer-events-none"></div>

<script src="config.js"></script>
<script>
/* Fallback Config */
(function(){
  if(window.FAMR_CONFIG_OK) return;
  window.CONFIG = window.CONFIG || { supabaseUrl:'...', supabaseAnonKey:'...' }; 
  window.STATE = window.STATE || { profile:null, groups:[], settings:{} };
})();
</script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
