<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAMR — Painel Inicial</title>
  <link rel="icon" href="famrlogo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="navContainer"></div>

<main class="main-content">
  <div class="page-header">
    <h2>🏠 Painel Inicial — FAMR</h2>
    <p>Bem-vindo ao sistema da Força Armada Militar Revolucionária.</p>
  </div>

  <div id="dashboardTopics" class="topics-grid">
    <div class="loading-spinner"><div class="spinner"></div><p>Carregando conteúdo...</p></div>
  </div>
</main>

<script src="auth.js"></script>
<script src="app.js"></script>
<script>
  (async () => {
    await initProtectedPage('dashboard');
    if (!window.currentProfile()) return;

    const topics = await fetchTopics('dashboard');
    renderTopicCards(topics, 'dashboardTopics');
  })();
</script>

</body>
</html>
